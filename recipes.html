<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore a variety of healthy recipes with detailed nutritional information.">
    <title>Recipes - Healthy Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">HealthyPlates</a>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/recipes.html">Recipes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/submit.html">Add Recipe</a>
                    </li>                    
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section text-center my-5">
        <h1>Explore Our Recipes</h1>
    </div>

    <!-- Recipe Detail Section -->
    <div class="container text-center my-5" style="margin-top: 0;">
        <h2 id="recipe-title"></h2>
        <div id="recipe-details" class="row"></div>
    </div>

    <!-- Footer Section -->
    <footer class="bg-dark text-white text-center py-4">
  
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Function to fetch and display a specific recipe
        async function fetchRecipe() {
            const urlParams = new URLSearchParams(window.location.search);
            const recipeId = urlParams.get('id'); // Get the recipe ID from the URL

            if (!recipeId) {
                document.getElementById('recipe-title').innerText = 'No recipe selected';
                return;
            }

            try {
                const response = await fetch(`/api/recipes/${recipeId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch recipe');
                }

                const recipe = await response.json();
                const recipeTitle = document.getElementById('recipe-title');
                const recipeDetails = document.getElementById('recipe-details');

                // Populate recipe title and details
                recipeTitle.innerText = recipe.title;
                recipeDetails.innerHTML = `
                    <div class="col-lg-6">
                        <img src="${recipe.imageURL}" class="img-fluid" alt="${recipe.title}">
                    </div>
                    <div class="col-lg-6 text-start">
                        <p><strong>Description:</strong> ${recipe.description}</p>
                        <ul class="list-unstyled">
                            <li><strong>Calories:</strong> ${recipe.calories} kcal</li>
                            <li><strong>Protein:</strong> ${recipe.protein}g</li>
                            <li><strong>Carbs:</strong> ${recipe.carbs}g</li>
                            <li><strong>Fat:</strong> ${recipe.fat}g</li>
                        </ul>
                    </div>
                `;
            } catch (error) {
                console.error('Error fetching recipe:', error);
                document.getElementById('recipe-title').innerText = 'Error loading recipe';
            }
        }

        // Call the function to fetch the recipe on page load
        fetchRecipe();
    </script>
</body>
</html>
