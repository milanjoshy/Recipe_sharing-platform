<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add your own healthy recipe with detailed nutritional information.">
    <title>Add Recipe - Healthy Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">HealthyPlates</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="recipes.html">Recipes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Add Recipe Form Section -->
    <section class="add-recipe-section">
        <div class="container">
            <h2 class="text-center my-4">Add Your Recipe</h2>
            <form action="/submit-recipe" method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label">Recipe Title</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="calories" class="form-label">Calories</label>
                    <input type="number" class="form-control" id="calories" name="calories" required>
                </div>
                <div class="mb-3">
                    <label for="protein" class="form-label">Protein (g)</label>
                    <input type="number" class="form-control" id="protein" name="protein" required>
                </div>
                <div class="mb-3">
                    <label for="carbs" class="form-label">Carbs (g)</label>
                    <input type="number" class="form-control" id="carbs" name="carbs" required>
                </div>
                <div class="mb-3">
                    <label for="fat" class="form-label">Fat (g)</label>
                    <input type="number" class="form-control" id="fat" name="fat" required>
                </div>
                <div class="mb-3">
                    <label for="imageURL" class="form-label">Image URL</label>
                    <input type="text" class="form-control" id="imageURL" name="imageURL" required>
                </div>
                <button type="submit" class="btn btn-primary">Submit Recipe</button>
            </form>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="bg-dark text-white text-center py-4">
   
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
